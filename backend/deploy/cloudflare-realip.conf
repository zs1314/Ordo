# nginx: for requests that come through Cloudflare (proxied, orange cloud), take the real visitor address Cloudflare reports
# (CF-Connecting-IP) as the client address. Only connections from the Cloudflare ranges below are trusted; direct connections
# (DNS-only sites, ssh tunnels, ...) keep their own address, so forging the header gets nowhere.
# Why: the login limit of 10 wrong passwords per ten minutes counts per address, and without this everyone would count as one of
# a few Cloudflare addresses; nginx's logs show the real address too.
# setup.sh installs it into /etc/nginx/conf.d/. The ranges come from https://www.cloudflare.com/ips-v4 and ips-v6 (retrieved
# 2026-11-04). If Cloudflare changes its ranges, regenerate this file from those two links and run zsh deploy/setup.sh again
# (it uploads the file, runs nginx -t and reloads).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
